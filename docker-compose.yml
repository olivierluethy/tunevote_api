services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    # Force utf8mb4 for every connection. --skip-character-set-client-handshake
    # makes the server IGNORE whatever charset a client requests and use the
    # server charset instead — so a mis-configured client, CLI, phpMyAdmin or
    # raw import can no longer open a latin1 session and double-encode text.
    # This closes the root cause of the mojibake bug at the source.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-character-set-client-handshake
    environment:
      # Credentials come from .env (git-ignored), never hard-coded here. See
      # .env.example for the placeholders. docker compose interpolates these.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tunevote}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Bind to the loopback interface ONLY — the database must never be reachable
      # from the public internet. The Node backend runs on the same host and
      # connects via 127.0.0.1:3306; that keeps working. To reach MySQL from your
      # workstation, use an SSH tunnel (see docs/2026-08-26-database-security-architecture.md),
      # never a public port. Do NOT change this to "3306:3306" — that re-exposes
      # the DB on 0.0.0.0.
      - "127.0.0.1:3306:3306"

  # phpMyAdmin is an administration interface and must NOT be publicly exposed.
  # It is gated behind the optional "admin" profile, so a plain `docker compose
  # up -d` does NOT start it. Bring it up only when you need it, and reach it
  # exclusively through an SSH tunnel to 127.0.0.1:8080 — it is bound to loopback
  # so it is never served on a public interface/subdomain.
  #
  #   Start (on the VPS, over SSH):  docker compose --profile admin up -d phpmyadmin
  #   Tunnel (from your machine):    ssh -L 8080:127.0.0.1:8080 <user>@<vps>
  #   Then browse:                   http://localhost:8080
  #   Stop when done:                docker compose --profile admin stop phpmyadmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: "no"
    profiles:
      - admin
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql
      # No root password baked in — log in interactively with a DB user instead.
      UPLOAD_LIMIT: 256M
    depends_on:
      - mysql

volumes:
  mysql_data:
