version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    # Force utf8mb4 for every connection. --skip-character-set-client-handshake
    # makes the server IGNORE whatever charset a client requests and use the
    # server charset instead — so a mis-configured client, CLI, phpMyAdmin or
    # raw import can no longer open a latin1 session and double-encode text.
    # This closes the root cause of the mojibake bug at the source.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123!
      MYSQL_DATABASE: tunevote
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass123!
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: rootpass123!
    depends_on:
      - mysql

volumes:
  mysql_data:
